security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        admin_users:
            memory:
                users:
                    admin:
                        password: '%app.admin_password_hash%'
                        roles: ['ROLE_SUPER_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|bundles)/
            security: false

        api:
            pattern: ^/api
            security: false

        main:
            lazy: true
            provider: admin_users
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_application_index
                enable_csrf: true
                csrf_token_id: authenticate
            logout:
                path: admin_logout
                target: admin_login

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/logout, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
