parameters:
    # Default local super-admin credentials:
    # login: admin
    # password: TempAdmin!2026
    # Override this hash in production via ADMIN_PASSWORD_HASH.
    app.default_admin_password_hash: '$2y$12$4L1U3009ffceyxtaCcoh2efQx.XeY48u6iStryuZJsIfrOUGPjQp.'

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users_in_memory:
            memory:
                users:
                    admin:
                        password: '%env(default:app.default_admin_password_hash:ADMIN_PASSWORD_HASH)%'
                        roles: ['ROLE_SUPER_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/api
            security: false

        admin:
            pattern: ^/admin
            lazy: true
            provider: users_in_memory
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login

        main:
            security: false

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/logout, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
